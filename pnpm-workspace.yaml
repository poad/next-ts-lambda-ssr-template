packages:
  - './app'
  - './cdk'

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - postcss@8.5.10
  - sharp@0.35.0
  - brace-expansion@5.0.8

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  eslint-import-resolver-typescript: '^4.4.5'
  postcss@<8.5.10: ^8.5.10
  semver: '>=7'
  sharp@<0.35.0: ^0.35.0

trustPolicy: no-downgrade
